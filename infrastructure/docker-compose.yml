name: videoflow

services:
  postgres:
    image: postgres:16-alpine
    container_name: videoflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-videoflow}
      POSTGRES_USER: ${POSTGRES_USER:-videoflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-videoflow_password}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: videoflow-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: videoflow-api
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      API_HOST: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL:-postgresql://videoflow:videoflow_password@postgres:5432/videoflow?schema=public}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - app

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: videoflow-worker
    restart: unless-stopped
    command: ["pnpm", "worker"]
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://videoflow:videoflow_password@postgres:5432/videoflow?schema=public}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - app

volumes:
  postgres-data:
  redis-data:
